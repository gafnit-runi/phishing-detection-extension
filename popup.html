<!DOCTYPE html>
<html>
<head>
  <title>Phishing Detection</title>
  <style>
    body {
      width: 300px;
      padding: 10px;
      font-family: Arial, sans-serif;
    }
    .status {
      margin: 10px 0;
      padding: 10px;
      border-radius: 4px;
    }
    .analyzing {
      background-color: #fff3cd;
      color: #856404;
    }
    .result {
      margin: 10px 0;
      padding: 10px;
      border-radius: 4px;
    }
    .phishing {
      background-color: #f8d7da;
      color: #721c24;
    }
    .benign {
      background-color: #d4edda;
      color: #155724;
    }
    .error {
      background-color: #f8d7da;
      color: #721c24;
    }
    .no-results {
      color: #6c757d;
    }
    .phishing-status {
      font-weight: bold;
    }
    .phishing-status:contains('⚠️') {
      color: #dc3545;
    }
    .phishing-status:contains('✅') {
      color: #28a745;
    }
    .scan-button {
      width: 100%;
      padding: 8px 16px;
      margin: 10px 0;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }
    .scan-button:hover {
      background-color: #0056b3;
    }
    .scan-button:disabled {
      background-color: #6c757d;
      cursor: not-allowed;
    }
    .url-container {
      word-break: break-all;
      margin: 10px 0;
      padding: 8px;
      background-color: #f8f9fa;
      border-radius: 4px;
    }
    .decision {
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
      text-align: center;
    }
    .decision.dangerous {
      background-color: #f8d7da;
      color: #721c24;
    }
    .decision.suspicious {
      background-color: #fff3cd;
      color: #856404;
    }
    .decision.safe {
      background-color: #d4edda;
      color: #155724;
    }
    .decision-icon {
      font-size: 20px;
      margin-right: 8px;
    }
    .risk-score {
      font-weight: bold;
    }
    .timestamp {
      color: #6c757d;
      font-size: 0.9em;
      margin-top: 10px;
    }
    h3 {
      margin: 0 0 10px 0;
      color: #343a40;
    }
    p {
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <h2>Phishing Detection</h2>
  <div id="status" class="status"></div>
  <div id="result" class="result"></div>
  <button id="scanButton" class="scan-button">Scan Now</button>
  <script src="popup.js"></script>
</body>
</html>
